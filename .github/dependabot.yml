version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️ chore"
      include: "scope"
    ignore:
      # Node version is pinned deliberately; don't let @types/node drift ahead of it
      - dependency-name: "@types/node"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "👷 ci"
